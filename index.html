<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Gym Tracker</title>
<style>
:root{--bg:#f4f3ef;--sf:#fff;--tx:#1b1e23;--mu:#6b7078;--ln:#dcdad3;--ac:#c98a00;--on:#1b1e23;--ok:#2f8f4e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181d;--sf:#1f242b;--tx:#eef0f2;--mu:#9aa1ab;--ln:#323945;--ac:#f2b84b;--on:#15181d;--ok:#5fc283}}
:root[data-theme="dark"]{--bg:#15181d;--sf:#1f242b;--tx:#eef0f2;--mu:#9aa1ab;--ln:#323945;--ac:#f2b84b;--on:#15181d;--ok:#5fc283}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-size:16px}
body{padding:0 10px 80px;max-width:560px;margin:0 auto}
h1{font-size:28px;margin:10px 0 2px;font-weight:700;letter-spacing:.2px}
h2{font-size:20px;margin:12px 0 4px;font-weight:700}
p{margin:2px 0;color:var(--mu);font-size:14px}
button{font:inherit;color:inherit;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:8px 12px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.pri{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:700;width:100%;padding:12px;font-size:18px}
.pri:disabled{opacity:.4}
.row{display:flex;gap:8px;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip.on{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:700}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:8px 10px;margin:6px 0}
.opt{display:flex;gap:10px;align-items:center;padding:6px 4px;border-bottom:1px solid var(--ln);cursor:pointer}
.opt:last-child{border:0}
.opt input{width:22px;height:22px;accent-color:var(--ac)}
.cnt{float:right;color:var(--mu);font-weight:700}
.cnt.full{color:var(--ok)}
.tag{color:var(--mu);font-size:13px}
table{width:100%;border-collapse:collapse;margin-top:4px}
th{font-weight:400;color:var(--mu);text-align:left;font-size:13px}
td{padding:2px 4px 2px 0}th:first-child,td:first-child{width:34px}
td input,td select{width:100%;font:inherit;padding:5px 8px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);color:var(--tx)}
.bar{position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:5;border-bottom:1px solid var(--ln)}
.time{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;border:0;border-radius:0;padding:10px 4px}
.nav button.on{color:var(--ac);font-weight:700}
.sm{padding:4px 9px;font-size:14px}
.rec{color:var(--ac);font-weight:700}
.pill{display:inline-block;color:#15181d;font-size:13px;font-weight:700;padding:1px 9px;border-radius:99px}
</style>
</head>
<body>
<div id="app"></div>
<nav class="nav" id="nav"></nav>
<script>
const DAYS={1:["Lunes",{Pecho:4,"Bíceps":3,Piernas:4,Abdominales:0}],2:["Martes",{Espalda:6,"Tríceps":4,Abdominales:0}],3:["Miércoles",{Piernas:7,Hombros:4,Abdominales:0}],4:["Jueves",{Pecho:4,"Bíceps":3,"Tríceps":3,Abdominales:0}],5:["Viernes",{Espalda:3,Piernas:4,Hombros:4,Abdominales:0}]};
const LIB0={
Pecho:["Press inclinado Smith","Press inclinado banco","Press inclinado banco mancuerna","Press plano barra","Press plano mancuernas","Press plano máquina","Fondos en paralelas inclinados","Aperturas en poleas","Pecho alto en poleas","Pecho bajo en poleas"],
"Bíceps":["Banco Scott W","Curl inclinado con mancuernas","Curl con barra","Curl en polea recta","Curl martillo","El 21","Curl con polea a una mano"],
Piernas:["Hip thrust","Sentadilla","Prensa","Peso muerto","Extensión de cuádriceps","Curl femoral","Abductor","Aductor","Gemelos","Estocadas"],
Espalda:["Dominadas","Jalón al pecho agarre abierto","Jalón al pecho agarre cerrado","Remo con barra","Remo máquina convergente","Remo en polea","Pullover en polea","Face pull","Remo unilateral con mancuerna"],
"Tríceps":["Press cerrado con barra","Fondos en paralelas","Extensión de tríceps por encima de la cabeza (polea)","Extensión de tríceps con mancuerna a una mano","Tríceps en polea con barra","Patada de burro","Patada de burro en polea baja"] ,
Hombros:["Press hombros","Vuelo lateral con mancuernas","Vuelo lateral en polea","Vuelo posterior","Y-Raise","Tirón de hombros en polea"],
Abdominales:["Plancha isométrica","Mountain climbers","Hollow hold","Dragon flag","Cable crunch","Bicicleta","Oblicuos","Tijera"]};
const GC={Pecho:"#e5484d","Bíceps":"#3e9bff","Tríceps":"#a06cf0",Espalda:"#2fb67c",Piernas:"#f2a03d",Hombros:"#14b8c4",Abdominales:"#c9d94a"};
const gc=g=>GC[g]||"#888",pill=g=>`<span class="pill" style="background:${gc(g)}">${g}</span>`;
const KEY="gymtracker.v1";
let S;
try{S=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){S=null}
if(!S)S={lib:JSON.parse(JSON.stringify(LIB0)),history:[],active:null,draft:null};
let mem=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){mem=true}}
(function(){const n="Tirón de hombros en polea";for(const g in S.lib)if(g!=="Hombros")S.lib[g]=S.lib[g].filter(x=>x!==n);if(!S.lib.Hombros.includes(n))S.lib.Hombros.push(n);if(!S.lib.Abdominales)S.lib.Abdominales=LIB0.Abdominales.slice();const fx=e=>{if(e.name===n)e.group="Hombros"};S.history.forEach(h=>h.exercises.forEach(fx));if(S.active)S.active.exercises.forEach(fx);if(S.draft&&S.draft["Tríceps"])S.draft["Tríceps"]=S.draft["Tríceps"].filter(x=>x!==n);save()})();
let view="home",day=(new Date().getDay()>=1&&new Date().getDay()<=5)?new Date().getDay():1,step=null,openId=null,cf=null,justDone=null,rest=null,rex=null,edit=null;
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=ms=>{let s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);s%=60;return(h?h+":":"")+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")};
const nf=n=>Math.round(n).toLocaleString("es-AR");
const dstr=t=>new Date(t).toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"numeric"});
const num=v=>parseFloat(String(v).replace(",","."))||0;
const vol=ex=>ex.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+num(s.kg)*num(s.reps),0),0);
const elapsed=a=>a.acc+(a.resumedAt?Date.now()-a.resumedAt:0);
function lastOf(name){for(let i=S.history.length-1;i>=0;i--){const e=S.history[i].exercises.find(x=>x.name===name);if(e){const ss=e.sets.filter(s=>num(s.kg)||num(s.reps));if(ss.length)return{date:S.history[i].start,sets:ss,note:e.note||""}}}return null}
function bestOf(name){let b=null;S.history.forEach(h=>h.exercises.forEach(e=>{if(e.name===name)e.sets.forEach(s=>{const k=num(s.kg),r=num(s.reps);if(k&&(!b||k>b.kg||(k===b.kg&&r>b.reps)))b={kg:k,reps:r}})}));return b}
const fs=s=>nf(num(s.kg)*10)/10===0?"":(num(s.kg)+" kg × "+num(s.reps));
function setsTxt(ss){return ss.map(s=>num(s.kg)+"×"+num(s.reps)).join(" / ")}

function nav(){const t=[["home","Hoy"],["hist","Historial"],["rec","Récords"],["data","Copia"]];$("#nav").innerHTML=t.map(([k,l])=>`<button data-a="nav" data-v="${k}" class="${view===k?"on":""}">${l}</button>`).join("")}
function render(){nav();const a=$("#app");
 if(view==="home")a.innerHTML=S.active?workout():step==="select"?select():step==="order"?order():home();
 else if(view==="hist")a.innerHTML=hist();else if(view==="data")a.innerHTML=data();else a.innerHTML=records();
 if(mem)a.insertAdjacentHTML("afterbegin",'<p class="rec">Ojo: este navegador no deja guardar datos. Lo que cargues se pierde al cerrar.</p>')}

function home(){const[n,g]=DAYS[day];
 return `<h1>Gym Tracker</h1><p>${dstr(Date.now())}</p>
 <div class="chips">${Object.keys(DAYS).map(d=>`<button class="chip ${+d===day?"on":""}" data-a="day" data-v="${d}">${DAYS[d][0]}</button>`).join("")}</div>
 <div class="card"><h2 style="margin-top:0">${n}</h2>${Object.entries(g).map(([k,v])=>`<p>${pill(k)} ${v?v+" ejercicios":"los que quieras"}</p>`).join("")}</div>
 <button class="pri" data-a="startsel">Elegir ejercicios</button>
 <p style="margin-top:12px">Sábado y domingo no tienen rutina fija. Elegí el día que quieras armar arriba.</p>`}

function select(){const g=DAYS[day][1],d=S.draft;
 const ok=Object.keys(g).every(k=>!g[k]||(d[k]||[]).length===g[k]);
 return `<button class="sm" data-a="cancel" style="margin-top:10px">‹ Atrás</button><h1>${DAYS[day][0]}</h1><p>Elegí la cantidad que pide cada grupo.</p>`+Object.keys(g).map(k=>{const c=(d[k]||[]).length;
 return `<div class="card" style="border-left:5px solid ${gc(k)}">${pill(k)}<span class="cnt ${g[k]&&c===g[k]?"full":""}">${g[k]?c+"/"+g[k]:c+" elegidos (opcional)"}</span>
 ${S.lib[k].map((n,i)=>`<label class="opt"><input type="checkbox" data-a="pick" data-g="${k}" data-i="${i}" ${(d[k]||[]).includes(n)?"checked":""}><span>${esc(n)}${(()=>{const L=lastOf(n);if(!L)return"";const t=L.sets.reduce((m,s)=>num(s.kg)>=num(m.kg)?s:m);return` <span class="tag">· última: ${num(t.kg)} kg × ${num(t.reps)}</span>`})()}</span></label>`).join("")}
 <div class="row" style="margin-top:8px"><input id="new-${k}" placeholder="Ejercicio nuevo de ${k.toLowerCase()}" style="flex:1;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);color:var(--tx)"><button class="sm" data-a="addex" data-g="${k}">Agregar</button></div></div>`}).join("")+
 `<button class="pri" data-a="begin" ${ok?"":"disabled"}>Comenzar entrenamiento</button><button style="width:100%;margin-top:8px" data-a="cancel">Volver</button>`}

function order(){const l=S.draft._order;
 return `<h1>Orden del entrenamiento</h1><p>Mezclá los grupos como quieras con las flechas.</p>`+l.map((e,i)=>`<div class="card row"><div style="flex:1"><b>${esc(e.name)}</b><div class="tag">${e.group}</div></div><button class="sm" data-a="mv" data-i="${i}" data-d="-1" ${i?"":"disabled"} aria-label="Subir">▲</button><button class="sm" data-a="mv" data-i="${i}" data-d="1" ${i<l.length-1?"":"disabled"} aria-label="Bajar">▼</button></div>`).join("")+
 `<button class="pri" data-a="begin">Comenzar entrenamiento</button><button style="width:100%;margin-top:8px" data-a="backsel">Cambiar selección</button>`}

function workout(){const a=S.active,done=a.exercises.filter(e=>e.sets.some(s=>num(s.kg)&&num(s.reps))).length;
 return `<div class="bar"><div class="row"><button class="sm" data-a="wback">‹ Atrás</button><div class="time" id="tm">${fmt(elapsed(a))}</div><div style="flex:1"></div>
 <button class="sm" data-a="pause">${a.resumedAt?"Pausar":"Seguir"}</button><button class="sm" data-a="finish">Finalizar</button></div>
 <p>${done}/${a.exercises.length} ejercicios · ${a.name}</p>${restRow()}${fpanel()}</div>`+a.exercises.map((e,i)=>{const L=lastOf(e.name),B=bestOf(e.name),ok=e.sets.some(s=>num(s.kg)&&num(s.reps));
 return (i===0||a.exercises[i-1].group!==e.group?`<h2>${pill(e.group)}</h2>`:"")+`<div class="card" style="border-left:5px solid ${gc(e.group)};${ok?"border-top-color:var(--ok);border-right-color:var(--ok);border-bottom-color:var(--ok)":""}"><div class="row"><b style="font-size:17px;flex:1">${ok?"✓ ":""}${esc(e.name)}</b>${L?`<button class="sm" data-a="uselast" data-i="${i}">Usar última</button>`:""}<button class="sm" data-a="emenu" data-i="${i}" aria-label="Opciones del ejercicio">⋯</button></div>${epanel(i)}
 <p>${L?`<span class="rec">Última (${dstr(L.date)}):</span> ${setsTxt(L.sets)} · ${nf(L.sets.reduce((x,s)=>x+num(s.kg)*num(s.reps),0))} kg`:"Primera vez"}${B?` · Mejor: <span class="rec">${B.kg}×${B.reps}</span>`:""}</p>${L&&L.note?`<p>Nota anterior: ${esc(L.note)}</p>`:""}<div id="pg${i}" class="rec" style="font-size:14px">${prog(e)}</div>
 <table><tr><th>Serie</th><th>Kg</th><th>Reps</th></tr>${e.sets.map((s,j)=>`<tr><td>${j+1}</td><td><input inputmode="decimal" data-a="inp" data-i="${i}" data-j="${j}" data-f="kg" value="${esc(s.kg)}" placeholder="${L&&L.sets[j]?num(L.sets[j].kg):"kg"}"></td><td><input inputmode="numeric" data-a="inp" data-i="${i}" data-j="${j}" data-f="reps" value="${esc(s.reps)}"></td></tr>`).join("")}</table>
 <div class="row" style="margin-top:4px"><button class="sm" data-a="ds" data-i="${i}">− Serie</button><button class="sm" data-a="as" data-i="${i}">+ Serie</button><input data-a="note" data-i="${i}" value="${esc(e.note||"")}" placeholder="Nota (opcional)" style="flex:1;min-width:0;font:inherit;font-size:14px;padding:4px 8px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);color:var(--tx)"></div></div>`}).join("")+apanel()+(cf==="discard"?`<p>¿Descartar y perder lo cargado?</p><div class="row"><button style="flex:1" data-a="discardyes">Sí, descartar</button><button style="flex:1" data-a="cfno">No</button></div>`:`<button style="width:100%" data-a="discard">Descartar entrenamiento</button>`)}

function hist(){if(openId!==null){const h=S.history.find(x=>x.id===openId);if(h)return `<button class="sm" data-a="back" style="margin-top:14px">‹ Historial</button>${justDone===h.id?`<div class="card" style="border-color:var(--ok)"><b style="font-size:22px">Entrenamiento guardado ✓</b><p>${h.exercises.reduce((a,e)=>a+e.sets.length,0)} series. La próxima vez que elijas estos ejercicios te muestro lo de hoy.</p></div>`:""}<h1>${dstr(h.start)}</h1><p>${fmt(h.dur)} · ${h.exercises.length} ejercicios · ${nf(vol(h.exercises))} kg de volumen</p>`+h.exercises.map((e,x)=>`<div class="card" style="border-left:5px solid ${gc(e.group)}"><b>${esc(e.name)}</b> ${pill(e.group)}<table><tr><th>Serie</th><th>Kg</th><th>Reps</th></tr>${e.sets.map((s,y)=>`<tr><td>${y+1}</td><td><input inputmode="decimal" data-a="hinp" data-h="${h.id}" data-x="${x}" data-y="${y}" data-f="kg" value="${esc(s.kg)}"></td><td><input inputmode="numeric" data-a="hinp" data-h="${h.id}" data-x="${x}" data-y="${y}" data-f="reps" value="${esc(s.reps)}"></td></tr>`).join("")}</table>${e.note?`<p>Nota: ${esc(e.note)}</p>`:""}</div>`).join("")+(cf==="del"?`<p>¿Borrar este entrenamiento?</p><div class="row"><button style="flex:1" data-a="delyes" data-id="${h.id}">Sí, borrar</button><button style="flex:1" data-a="cfno">No</button></div>`:`<button style="width:100%" data-a="delh" data-id="${h.id}">Borrar este entrenamiento</button>`)}
 const l=[...S.history].reverse();
 return `<h1>Historial</h1>`+(l.length?l.map(h=>`<div class="card" data-a="open" data-id="${h.id}" style="cursor:pointer"><b>${dstr(h.start)}</b><p>${[...new Set(h.exercises.map(e=>e.group))].map(pill).join(" ")}</p><p>${fmt(h.dur)} · ${nf(vol(h.exercises))} kg de volumen</p></div>`).join(""):`<p>Todavía no guardaste entrenamientos. Cuando termines el primero aparece acá.</p>`)}

function records(){if(rex)return `<button class="sm" data-a="rback" style="margin-top:14px">‹ Récords</button><h1>${esc(rex)}</h1>`+chart(rex);const m={};S.history.forEach(h=>h.exercises.forEach(e=>{const b=bestOf(e.name);if(b)m[e.name]=[e.group,b]}));
 const k=Object.keys(m).sort();
 return `<h1>Récords</h1>`+(k.length?k.map(n=>`<div class="card row" data-a="rex" data-n="${esc(n)}" style="cursor:pointer;border-left:5px solid ${gc(m[n][0])}"><div style="flex:1"><b>${esc(n)}</b><div>${pill(m[n][0])}</div></div><span class="rec">${m[n][1].kg} kg × ${m[n][1].reps}</span></div>`).join(""):`<p>Acá van a aparecer tus mejores marcas por ejercicio apenas cargues pesos.</p>`)}

document.addEventListener("click",ev=>{const t=ev.target.closest("[data-a]");if(!t||t.tagName==="INPUT"&&t.type!=="checkbox")return;const a=t.dataset.a,D=t.dataset;
 if(a==="nav"){view=D.v;openId=null;cf=null;justDone=null;rex=null;edit=null}
 else if(a==="day")day=+D.v;
 else if(a==="startsel"){step="select";S.draft={}}
 else if(a==="cancel"||a==="backsel"){step=a==="cancel"?null:"select"}
 else if(a==="pick")return;
 else if(a==="exp"){$("#bk").value=JSON.stringify({lib:S.lib,history:S.history});return}
 else if(a==="cp"){const b=$("#bk");if(!b.value)b.value=JSON.stringify({lib:S.lib,history:S.history});b.select();try{navigator.clipboard.writeText(b.value)}catch(x){try{document.execCommand("copy")}catch(y){}}$("#bm").textContent="Copiado.";return}
 else if(a==="imp"){try{const o=JSON.parse($("#bk").value);if(!Array.isArray(o.history))throw 0;S.history=o.history;if(o.lib)S.lib=o.lib;save();$("#bm").textContent="Restaurado: "+o.history.length+" entrenamientos."}catch(x){$("#bm").textContent="Ese texto no parece una copia válida."}return}
 else if(a==="uselast"){const e=S.active.exercises[+D.i],L=lastOf(e.name);if(L)e.sets=L.sets.map(x=>({kg:String(num(x.kg)),reps:String(num(x.reps)),rt:true}));save()}
 else if(a==="rst")rest=+D.v?Date.now()+D.v*1000:null;
 else if(a==="rex")rex=D.n;
 else if(a==="rback")rex=null;
 else if(a==="emenu")edit={m:"menu",i:+D.i};
 else if(a==="eclose")edit=null;
 else if(a==="edel")edit={m:"del",i:+D.i};
 else if(a==="edelyes"){S.active.exercises.splice(+D.i,1);edit=null;save()}
 else if(a==="eswap")edit={m:"swap",i:+D.i};
 else if(a==="eswapto"){const e=S.active.exercises[edit.i];e.name=D.n;e.sets=mk();e.note="";edit=null;save()}
 else if(a==="eadd")edit={m:"add",g:null};
 else if(a==="eaddg")edit={m:"add",g:D.g};
 else if(a==="eaddpick"){addEx(edit.g,D.n)}
 else if(a==="eaddnew"){const v=($("#newx").value||"").trim(),g=edit.g;if(!v)return;if(!S.lib[g].includes(v))S.lib[g].push(v);if(S.active.exercises.some(x=>x.name===v)){edit=null}else addEx(g,v)}
 else if(a==="addex"){const i=$("#new-"+D.g),v=i.value.trim();if(v&&!S.lib[D.g].includes(v)){S.lib[D.g].push(v);save()}else return}
 else if(a==="toorder"){const l=[];Object.keys(DAYS[day][1]).forEach(g=>S.draft[g].forEach(n=>l.push({group:g,name:n})));S.draft._order=l;step="order"}
 else if(a==="mv"){const l=S.draft._order,i=+D.i,j=i+ +D.d;[l[i],l[j]]=[l[j],l[i]]}
 else if(a==="begin"){S.active={name:DAYS[day][0],start:Date.now(),acc:0,resumedAt:Date.now(),exercises:Object.keys(DAYS[day][1]).flatMap(g=>(S.draft[g]||[]).map(n=>({group:g,name:n}))).map(e=>({group:e.group,name:e.name,sets:mk(e.name)}))};S.draft=null;step=null;save()}
 else if(a==="pause"){const x=S.active;if(x.resumedAt){x.acc+=Date.now()-x.resumedAt;x.resumedAt=null}else x.resumedAt=Date.now();save()}
 else if(a==="as"){{const ss=S.active.exercises[+D.i].sets,k0=ss[0]?ss[0].kg:"";ss.push({kg:k0,reps:"8",auto:!!k0});save()}}
 else if(a==="ds"){const s=S.active.exercises[+D.i].sets;if(s.length>1)s.pop();save()}
 else if(a==="finish")cf="finish";
 else if(a==="cfno")cf=null;
 else if(a==="nosave")cf="nosave";
 else if(a==="nosaveyes"){S.active=null;cf=null;rest=null;save()}
 else if(a==="wback")cf="wback";
 else if(a==="wbackyes"){const x=S.active,d=Object.keys(DAYS).find(k=>DAYS[k][0]===x.name);if(d)day=+d;const dr={};x.exercises.forEach(e=>{(dr[e.group]=dr[e.group]||[]).push(e.name)});S.draft=dr;S.active=null;cf=null;rest=null;step="select";save()}
 else if(a==="finishyes"){const x=S.active;const dur=elapsed(x);const ex=x.exercises.map(e=>({...e,sets:e.sets.filter(s=>num(s.kg)>0||s.rt)})).filter(e=>e.sets.length);
  const h={id:Date.now(),start:x.start,end:Date.now(),dur,name:x.name,exercises:ex};S.history.push(h);S.active=null;cf=null;save();view="hist";openId=h.id;justDone=h.id}
 else if(a==="discard")cf="discard";
 else if(a==="discardyes"){S.active=null;cf=null;save()}
 else if(a==="open")openId=+D.id;
 else if(a==="back")openId=null;
 else if(a==="delh")cf="del";
 else if(a==="delyes"){S.history=S.history.filter(h=>h.id!==+D.id);openId=null;cf=null;save()}
 render()});
document.addEventListener("change",ev=>{const t=ev.target;if(t.dataset.a!=="pick")return;const g=t.dataset.g,n=S.lib[g][+t.dataset.i],max=DAYS[day][1][g];let l=S.draft[g]||[];
 if(t.checked){if(max&&l.length>=max){t.checked=false;return}l.push(n)}else l=l.filter(x=>x!==n);S.draft[g]=l;render()});
document.addEventListener("input",ev=>{const t=ev.target;const A=t.dataset.a;if(A==="note"){S.active.exercises[+t.dataset.i].note=t.value;save();return}if(A==="hinp"){const h=S.history.find(x=>x.id===+t.dataset.h);h.exercises[+t.dataset.x].sets[+t.dataset.y][t.dataset.f]=t.value;save();return}if(A!=="inp")return;const i=+t.dataset.i,j=+t.dataset.j,f=t.dataset.f,e=S.active.exercises[i];e.sets[j][f]=t.value;if(f==="reps")e.sets[j].rt=true;
 if(f==="kg"){if(j===0)e.sets.forEach((x,k)=>{if(k>0&&(x.auto||!x.kg)){x.kg=t.value;x.auto=true;const el=document.querySelector(`[data-i="${i}"][data-j="${k}"][data-f="kg"]`);if(el)el.value=t.value}});else e.sets[j].auto=false}
 const pg=document.getElementById("pg"+i);if(pg)pg.textContent=prog(e);
 save()});
setInterval(()=>{if(S.active&&view==="home"&&!step){const e=$("#tm");if(e)e.textContent=fmt(elapsed(S.active));if(rest){const r=$("#rs"),l=rest-Date.now();if(l<=0){rest=null;if(r)r.textContent="¡Descanso listo!";try{navigator.vibrate(300)}catch(x){}}else if(r)r.textContent="Descanso "+fmt(l)}}},500);
function mk(n){return Array.from({length:3},()=>({kg:"",reps:"8"}))}
function e1(s){return num(s.kg)*(1+num(s.reps)/30)}
function prog(e){const ss=e.sets.filter(s=>num(s.kg)>0);if(!ss.length)return"";const t=ss.reduce((m,s)=>e1(s)>e1(m)?s:m),L=lastOf(e.name),B=bestOf(e.name);
 if(B&&num(t.kg)>B.kg)return"🏆 Nuevo récord: "+num(t.kg)+" kg";
 if(L){const lt=L.sets.reduce((m,s)=>e1(s)>e1(m)?s:m);if(e1(t)>e1(lt)+.01)return"📈 ¡Mejoraste! Antes "+num(lt.kg)+"×"+num(lt.reps)+", hoy "+num(t.kg)+"×"+num(t.reps)}return""}
function fpanel(){const b=(t,a,st)=>`<button style="flex:1;${st||""}" data-a="${a}">${t}</button>`,P='margin:6px 0;border-color:var(--ac)';
 if(cf==="finish")return `<div class="card" style="${P}"><b>¿Guardar el entrenamiento?</b><div class="row" style="margin-top:6px">${b("Guardar","finishyes","background:var(--ac);color:var(--on);font-weight:700")}${b("No guardar","nosave")}${b("Seguir","cfno")}</div></div>`;
 if(cf==="nosave")return `<div class="card" style="${P}"><b>¿Salir sin guardar?</b><p>Se pierde todo lo que cargaste en este entrenamiento.</p><div class="row" style="margin-top:6px">${b("Sí, salir sin guardar","nosaveyes")}${b("Volver","finish")}</div></div>`;
 if(cf==="wback")return `<div class="card" style="${P}"><b>¿Volver a elegir los ejercicios?</b><p>Podés cambiar la selección o el día. Lo que cargaste en este entrenamiento se descarta.</p><div class="row" style="margin-top:6px">${b("Sí, volver","wbackyes")}${b("Seguir entrenando","cfno")}</div></div>`;return""}
function addEx(g,n){const L=S.active.exercises;let k=-1;L.forEach((x,i)=>{if(x.group===g)k=i});const ex={group:g,name:n,sets:mk()};if(k<0)L.push(ex);else L.splice(k+1,0,ex);edit=null;save()}
function epanel(i){if(!edit||edit.i!==i)return"";const e=S.active.exercises[i],used=S.active.exercises.map(x=>x.name),b=(t,a)=>`<button class="sm" data-a="${a}" data-i="${i}">${t}</button>`;
 if(edit.m==="menu")return `<div class="row" style="margin:4px 0">${b("Cambiar ejercicio","eswap")}${b("Quitar","edel")}${b("Cerrar","eclose")}</div>`;
 if(edit.m==="del")return `<div class="card" style="border-color:var(--ac)"><b>¿Quitar este ejercicio?</b><p>Se pierde lo que cargaste en él.</p><div class="row" style="margin-top:4px">${b("Sí, quitar","edelyes")}${b("No","eclose")}</div></div>`;
 if(edit.m==="swap")return `<div class="card" style="border-color:var(--ac)"><b>Cambiar por otro de ${e.group}</b><div style="margin-top:4px">${S.lib[e.group].filter(n=>!used.includes(n)).map(n=>`<button class="sm" style="margin:2px" data-a="eswapto" data-n="${esc(n)}">${esc(n)}</button>`).join("")}</div><button class="sm" data-a="eclose" style="margin-top:6px">Cancelar</button></div>`;return""}
function apanel(){if(!edit||edit.m!=="add")return `<button style="width:100%;margin:6px 0" data-a="eadd">+ Agregar ejercicio</button>`;
 const used=S.active.exercises.map(x=>x.name),g=edit.g;
 return `<div class="card" style="border-color:var(--ac)"><b>Agregar ejercicio</b><div class="chips">${Object.keys(S.lib).map(k=>`<button class="chip sm ${g===k?"on":""}" data-a="eaddg" data-g="${k}">${k}</button>`).join("")}</div>${g?`<div>${S.lib[g].filter(n=>!used.includes(n)).map(n=>`<button class="sm" style="margin:2px" data-a="eaddpick" data-n="${esc(n)}">${esc(n)}</button>`).join("")}</div><div class="row" style="margin-top:6px"><input id="newx" placeholder="Ejercicio nuevo de ${g.toLowerCase()}" style="flex:1;min-width:0;font:inherit;font-size:14px;padding:4px 8px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);color:var(--tx)"><button class="sm" data-a="eaddnew">Agregar</button></div>`:"<p>Elegí un grupo.</p>"}<button class="sm" data-a="eclose" style="margin-top:6px">Cancelar</button></div>`}
function restRow(){return `<div class="row" style="margin-top:6px">${rest?`<b id="rs" class="rec">Descanso ${fmt(Math.max(0,rest-Date.now()))}</b><button class="sm" data-a="rst" data-v="0">✕</button>`:`<span class="tag">Descanso:</span>${[60,90,120].map(v=>`<button class="sm" data-a="rst" data-v="${v}">${v}s</button>`).join("")}`}</div>`}
function data(){return `<h1>Copia de seguridad</h1><p>Generá la copia, copiala y guardala en tus notas o mandátela por mail. Si algún día perdés los datos, la pegás acá y la restaurás.</p>
<div class="row" style="margin-top:8px"><button class="sm" data-a="exp">Generar copia</button><button class="sm" data-a="cp">Copiar</button></div>
<textarea id="bk" rows="8" style="width:100%;margin-top:8px;font:14px monospace;background:var(--sf);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:8px" placeholder="Acá aparece la copia, o pegá una para restaurar"></textarea>
<button class="sm" data-a="imp" style="margin-top:8px">Restaurar desde este texto</button><p id="bm" class="rec"></p>`}
function chart(n){const pts=[];S.history.forEach(h=>h.exercises.forEach(e=>{if(e.name===n)pts.push({d:h.start,k:Math.max(...e.sets.map(s=>num(s.kg))),v:e.sets.reduce((a,s)=>a+num(s.kg)*num(s.reps),0)})}));
 const list=pts.map(p=>`<p>${dstr(p.d)} · ${p.k} kg máx. · ${nf(p.v)} kg de volumen</p>`).join("");
 if(pts.length<2)return `<p>Con 2 o más entrenamientos de este ejercicio aparece el gráfico.</p>`+list;
 const mx=Math.max(...pts.map(p=>p.k)),mn=Math.min(...pts.map(p=>p.k)),X=i=>15+i*270/(pts.length-1),Y=k=>95-(mx===mn?.5:(k-mn)/(mx-mn))*70;
 const ch=mn?Math.round((pts[pts.length-1].k-pts[0].k)/mn*1000)/10:0;
 return `<div class="card"><svg viewBox="0 0 300 110" width="100%" role="img" aria-label="Peso máximo por entrenamiento"><polyline fill="none" stroke="var(--ac)" stroke-width="3" points="${pts.map((p,i)=>X(i)+","+Y(p.k)).join(" ")}"/>${pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.k)}" r="4" fill="var(--ac)"/><text x="${X(i)}" y="${Y(p.k)-8}" font-size="11" text-anchor="middle" fill="currentColor">${p.k}</text>`).join("")}</svg><p>Peso máximo por entrenamiento. Primero ${pts[0].k} kg, último ${pts[pts.length-1].k} kg (${ch>0?"+":""}${ch}%).</p></div>`+list}
document.addEventListener("focusin",ev=>{const t=ev.target;if(t.dataset&&t.dataset.a==="inp")setTimeout(()=>{try{t.select()}catch(x){}},0)});
render();
</script>
</body>
</html>
